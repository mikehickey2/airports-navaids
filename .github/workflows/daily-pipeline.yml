name: Daily FAA Data Pipeline

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Force download even if data is current'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  issues: write

# Deliberately does not cancel in progress: a dispatch must not overlap the
# 12:00 UTC cron, because both runs clear_table() and repopulate Supabase.
# Cancelling a pipeline mid-push is worse than queueing it. Note this queues at
# most one pending run; a third concurrent trigger cancels the pending one.
concurrency:
  group: daily-pipeline
  cancel-in-progress: false

env:
  # Workflow level, matching ci.yml, so both files carry exactly one literal in
  # the same position. Previously declared at step level on Setup renv; that
  # placement was justified as "defense in depth" against setup-r writing this
  # variable into GITHUB_ENV, but use-public-rspm: false removed that competing
  # writer, and step scope put the value out of reach of the ungated shape check
  # below and of the effective-value check after Setup R.
  #
  # The date MUST match ci.yml and MUST move whenever renv.lock changes.
  # Entries MUST be NAME=URL; renv_repos_validate() aborts on two or more
  # unnamed entries.
  RENV_CONFIG_REPOS_OVERRIDE: 'PPM=https://packagemanager.posit.co/cran/__linux__/noble/2026-07-28;CRAN=https://cloud.r-project.org'

jobs:
  check-and-run:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Deliberately UNGATED, so it runs on every daily check rather than only on
      # cycle day. Everything below the needs_update gate executes roughly once
      # per 28-day cycle, and that execution is the one that writes to Supabase.
      # A malformed override would otherwise surface on cycle day, during the run
      # that matters, with the next chance to observe it four weeks later.
      #
      # This reads the DECLARED value, before Setup R runs. It is not the
      # effective value that renv will ultimately receive: setup-r can write this
      # variable into GITHUB_ENV and shadow it, which is why use-public-rspm is
      # set to false below. The "Assert override survived Setup R" step inside the
      # gate covers that case. Do not mistake this check for that guarantee.
      #
      # An earlier draft grepped this file for the literal instead of reading the
      # variable. That form matched its own source text, because the grep pattern
      # necessarily appears in the file being grepped, and head -1 returned the
      # self-match, yielding "literal: [^". Moving the override to workflow level
      # put it in scope here and deleted that entire failure mode rather than
      # anchoring around it.
      - name: Assert repository override is well formed
        run: |
          set -euo pipefail

          LITERAL="${RENV_CONFIG_REPOS_OVERRIDE:-}"
          if [ -z "$LITERAL" ]; then
            echo "::error::RENV_CONFIG_REPOS_OVERRIDE is unset or empty"
            exit 1
          fi
          echo "literal: $LITERAL"

          IFS=';' read -r -a ENTRIES <<< "$LITERAL"
          echo "declared entries: ${#ENTRIES[@]}"

          if [ "${#ENTRIES[@]}" -ne 2 ]; then
            echo "::error::expected 2 entries, got ${#ENTRIES[@]}. renv splits on semicolons, not commas."
            exit 1
          fi

          for e in "${ENTRIES[@]}"; do
            if ! printf '%s' "$e" | grep -qE '^[A-Za-z][A-Za-z0-9._]*=https?://'; then
              echo "::error::every entry must be NAME=URL. renv_repos_validate() aborts with \"all repository entries must be named\" when two or more are unnamed. Offending: $e"
              exit 1
            fi
          done

          echo "names: $(printf '%s\n' "${ENTRIES[@]}" | sed 's/=.*$//' | paste -sd, -)"
          echo "literal is well formed"

      - name: Check FAA dates
        id: check
        run: |
          echo "Checking FAA NASR subscription dates..."

          PAGE=$(curl -s "https://www.faa.gov/air_traffic/flight_info/aeronav/aero_data/NASR_Subscription/")

          # FAA page structure: <h2>Current</h2> followed by <li>...Subscription effective DATE
          # Extract the first "Subscription effective" date after "Current" heading
          CURRENT=$(echo "$PAGE" | grep -A5 '<h2>Current</h2>' | grep -oP 'Subscription effective \K[A-Za-z]+ \d{1,2}, \d{4}' | head -1)
          PREVIEW=$(echo "$PAGE" | grep -A5 '<h2>Preview</h2>' | grep -oP 'Subscription effective \K[A-Za-z]+ \d{1,2}, \d{4}' | head -1)

          if [[ -z "$CURRENT" ]]; then
            echo "::error::Could not parse current date from FAA website"
            echo "Debug: Page content around Current heading:"
            echo "$PAGE" | grep -A10 -i "current" | head -15
            exit 1
          fi

          CURRENT_ISO=$(date -d "$CURRENT" +%Y-%m-%d)
          PREVIEW_ISO=$(date -d "$PREVIEW" +%Y-%m-%d 2>/dev/null || echo "unknown")

          # Read the last processed date from README (reflects what's in the database)
          LAST_KNOWN=$(grep -oP '<!-- pipeline:faa_date -->\K[^<]+' README.md || echo "")

          echo "Current FAA date: $CURRENT ($CURRENT_ISO)"
          echo "Preview FAA date: $PREVIEW ($PREVIEW_ISO)"
          echo "Last processed date: $LAST_KNOWN"

          echo "current_date=$CURRENT_ISO" >> $GITHUB_OUTPUT
          echo "preview_date=$PREVIEW_ISO" >> $GITHUB_OUTPUT

          # Run pipeline if FAA current date is newer than what we last processed
          if [[ -z "$LAST_KNOWN" ]] || [[ "$CURRENT_ISO" > "$LAST_KNOWN" ]]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
            echo "FAA current ($CURRENT_ISO) is newer than last processed ($LAST_KNOWN) - pipeline will run"
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
            echo "Already up to date ($LAST_KNOWN)"
          fi

      - name: Write status summary
        run: |
          echo "## FAA NASR Data Check" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Current FAA Date | ${{ steps.check.outputs.current_date }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Preview FAA Date | ${{ steps.check.outputs.preview_date }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Needs Update | ${{ steps.check.outputs.needs_update }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Force Flag | ${{ github.event.inputs.force }} |" >> $GITHUB_STEP_SUMMARY

      - name: Install system dependencies
        if: steps.check.outputs.needs_update == 'true' || github.event.inputs.force == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcurl4-openssl-dev \
            libfontconfig1-dev \
            libfreetype6-dev \
            libicu-dev \
            libssl-dev \
            libx11-dev \
            libxml2-dev \
            pandoc

      - name: Setup R
        if: steps.check.outputs.needs_update == 'true' || github.event.inputs.force == 'true'
        uses: r-lib/actions/setup-r@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          r-version: '4.6'
          # REQUIRED. See ci.yml for the full reasoning. With the default (true),
          # setup-r writes RENV_CONFIG_REPOS_OVERRIDE into GITHUB_ENV pointing at
          # noble/latest. Whether a later step-level env: would win over that is
          # not documented by GitHub and has never been exercised here, because
          # this file's step-level value and setup-r's computed value were
          # byte-identical until the snapshot was pinned. Disabling the writer
          # removes the question rather than assuming an answer, which matters
          # more here than in ci.yml because this workflow writes to production.
          use-public-rspm: false

      # Runs AFTER Setup R, so it observes the EFFECTIVE value rather than the
      # declared one. This is the regression detector for use-public-rspm: if that
      # input is ever removed or flipped back to its "true" default, setup-r writes
      # RENV_CONFIG_REPOS_OVERRIDE into GITHUB_ENV pointing at noble/latest, the
      # workflow-level declaration is shadowed, and this step fails here rather
      # than letting renv restore from the wrong repository on the one run per
      # cycle that writes to Supabase.
      #
      # Gated, so it runs only on cycle day. The ungated shape check near the top
      # of this job gives the daily signal on the declared value.
      - name: Assert override survived Setup R
        if: steps.check.outputs.needs_update == 'true' || github.event.inputs.force == 'true'
        run: |
          Rscript -e '
          raw <- Sys.getenv("RENV_CONFIG_REPOS_OVERRIDE")
          if (!nzchar(raw)) stop("RENV_CONFIG_REPOS_OVERRIDE is unset after Setup R")
          entries <- strsplit(raw, ";", fixed = TRUE)[[1]]
          cat("effective entries:", length(entries), "\n")
          print(entries)
          if (length(entries) != 2L) {
            stop("expected 2 entries, got ", length(entries),
                 ". If this reads noble/latest, setup-r shadowed the declared ",
                 "value; check use-public-rspm.")
          }
          bad <- !grepl("^[A-Za-z][A-Za-z0-9._]*=https?://", entries)
          if (any(bad)) {
            stop("every entry must be NAME=URL. renv_repos_validate() aborts with ",
                 "\"all repository entries must be named\" when two or more are ",
                 "unnamed. Offending: ", paste(entries[bad], collapse = ", "))
          }
          cat("names:", paste(sub("=.*$", "", entries), collapse = ", "), "\n")
          '

      - name: Setup renv
        if: steps.check.outputs.needs_update == 'true' || github.event.inputs.force == 'true'
        uses: r-lib/actions/setup-renv@d3c5be51b12e724e68f33216ca3c148b66d5f0b6 # v2
        with:
          # See ci.yml. Bumped because the package source changes in this commit
          # and the cache key does not include RENV_CONFIG_REPOS_OVERRIDE.
          # The repository override is declared at workflow level, not here.
          cache-version: 2

      - name: Run pipeline
        if: steps.check.outputs.needs_update == 'true' || github.event.inputs.force == 'true'
        id: pipeline
        env:
          SUPABASE_API_KEY: ${{ secrets.SUPABASE_API_KEY }}
        run: |
          FORCE_FLAG="${{ github.event.inputs.force == 'true' && 'TRUE' || 'FALSE' }}"

          Rscript -e "
          source('R/scrape_airports_navaids.R')
          result <- run_pipeline(force = ${FORCE_FLAG})

          # Write outputs for summary
          cat('airports_count=', result\$airports_count, '\n', sep = '', file = Sys.getenv('GITHUB_OUTPUT'), append = TRUE)
          cat('navaids_count=', result\$navaids_count, '\n', sep = '', file = Sys.getenv('GITHUB_OUTPUT'), append = TRUE)
          cat('status=', result\$status, '\n', sep = '', file = Sys.getenv('GITHUB_OUTPUT'), append = TRUE)
          "

      - name: Write pipeline results
        if: steps.check.outputs.needs_update == 'true' || github.event.inputs.force == 'true'
        run: |
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "## Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Status | ${{ steps.pipeline.outputs.status }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Airports | ${{ steps.pipeline.outputs.airports_count }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Navaids | ${{ steps.pipeline.outputs.navaids_count }} |" >> $GITHUB_STEP_SUMMARY

      - name: Commit pipeline outputs
        if: steps.pipeline.outputs.status == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md data/pipeline_history.csv .github/badges/
          if git diff --cached --quiet; then
            echo "No changes to commit - skipping"
          else
            git commit -m "data: update README and pipeline history for NASR cycle"
            git push
          fi

      - name: Notify on pipeline success
        if: steps.pipeline.outputs.status == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "NASR Update: ${{ steps.check.outputs.current_date }}" \
            --label "pipeline-run" \
            --body "Pipeline completed successfully.

          | Metric | Value |
          |--------|-------|
          | FAA Date | ${{ steps.check.outputs.current_date }} |
          | Airports | ${{ steps.pipeline.outputs.airports_count }} |
          | Navaids | ${{ steps.pipeline.outputs.navaids_count }} |

          [View run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"

      # Fires on ANY job failure, not only when the pipeline step itself failed.
      # The previous condition also required steps.pipeline.outcome == 'failure',
      # which meant a rejected data commit or a failed FAA date check produced no
      # issue at all, leaving Supabase and the repository silently out of step.
      - name: Notify on pipeline failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Pipeline failed. Step outcomes:"
            echo ""
            echo "| Step | Outcome |"
            echo "|------|---------|"
            echo "| Check FAA dates | ${{ steps.check.outcome }} |"
            echo "| Run pipeline | ${{ steps.pipeline.outcome }} |"
            echo ""
            echo "[View run logs](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          } > /tmp/failure-body.md

          gh issue create \
            --repo "${{ github.repository }}" \
            --title "NASR Pipeline FAILED: ${{ steps.check.outputs.current_date || github.run_id }}" \
            --label "pipeline-failure" \
            --body-file /tmp/failure-body.md
